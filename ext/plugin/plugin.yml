name: Stratum
main: Stratum\PMMP\Main
version: 0.1.0
# What this was written against and read from: PocketMine-MP 5.44.4's own
# source. Declared as 5.44.0 rather than 5.0.0 deliberately — the API check
# accepts any server whose version is at or above the declared one within the
# same major, so this refuses to load on an older 5.x whose block state and
# world-format APIs this plugin has not been read against. Exactly one 5.x
# entry: PocketMine-MP rejects two suffix-less entries of the same major as
# ambiguous.
api: [5.44.0]
# The generator has to be registered before worlds load, and worlds load
# between the STARTUP and POSTWORLD enable phases. Registration itself
# happens in onLoad(), which runs before either.
load: STARTUP
src-namespace-prefix: Stratum\PMMP
# The engine itself. Declared so a server without the module says so at load
# time, by name, instead of failing inside a generation worker thread.
extensions:
  stratum: "*"
author: Stratum contributors
description: Vanilla Java Edition terrain, generated by Stratum's C++ engine.
