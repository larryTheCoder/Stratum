# Stratum CI.
#
# SPEC §5.5 makes the build matrix part of the determinism contract: the
# unit suites run on x86-64 AND ARM64 across Linux, Windows and macOS, the
# conformance suite on Linux x86-64 and ARM64 against the same probe worlds
# and region goldens, and a cross-architecture divergence is a build
# failure, never "noise".
#
# No generator is pinned; each platform uses its native default (Make on
# Linux, Make on macOS, MSBuild on Windows), so CI needs no extra toolchain
# installs to build.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays and Thursdays, an ordinary full run of main: no cache entry of
    # main's (the probe worlds above all) goes the 7 days unread after which
    # GitHub evicts it, so a pull request opened after a quiet week does not
    # start by regenerating them.
    - cron: '41 5 * * 1,4'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A pull request's new push cancels its superseded run, running or not.
  # Any other run in progress is never cancelled: a main run that is
  # generating probe worlds must get to save them, or the next one starts
  # again from nothing. A pending one is still replaced by a newer run in
  # the same group, as GitHub does for every concurrency group (at most one
  # pending), so a push to main can take the place of a queued main,
  # scheduled or dispatched run, which then never runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned so formatting is identical on every machine; clang-format output
  # changes between major versions.
  CLANG_FORMAT_VERSION: "18.1.8"
  # Keep in sync with SPEC §3 and STRATUM_MINECRAFT_VERSION (and
  # tools/probe-worlds, whose lint checks it).
  MINECRAFT_VERSION: "1.21.11"
  # Part of every probe-world cache key (tools/probe-worlds key). Bump the
  # epoch to regenerate every shard: a bad entry, or a generation input no
  # hashed file carries (the heap, the runner image). PROBE_JAVA is the JDK
  # major the probes job pins.
  PROBE_CACHE_EPOCH: "1"
  PROBE_JAVA: "25"

jobs:
  lint:
    name: lint (format, determinism policy, clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pin the JDK
        # The vector generators use the JDK as an oracle, so which JDK is a
        # reproducibility input: the Xoroshiro implementation has moved
        # package between releases, and the derived nextInt/nextDouble draws
        # come from RandomGenerator's default methods. The runner's default
        # Java had no jdk.internal.random at all, which is how this surfaced.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install pinned clang-format
        # pipx, not pip: Ubuntu 24.04's system Python is externally managed.
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: clang-format
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          tools/lint/format.sh

      - name: Determinism and provenance policy
        run: tools/lint/check-determinism.sh

      - name: Generated test vectors are reproducible
        # The known-answer vectors must come from a JVM, never from a human
        # editing the numbers. Re-run the generator and require an exact match.
        run: |
          for generator in tools/vectors/*.java; do
            name="$(basename "${generator}" .java)"
            case "${name}" in
              JavaMathVectors)   target=tests/unit/javamath_vectors.inc ;;
              JavaRandomVectors) target=tests/unit/java_random_vectors.inc ;;
              StrictMathVectors) target=tests/unit/fdlibm_vectors.inc ;;
              XoroshiroVectors)  target=tests/unit/xoroshiro_vectors.inc ;;
              *) echo "no known target for ${generator}"; exit 1 ;;
            esac
            # A generator that needs JDK internals declares the flags itself,
            # on a `// JAVA_FLAGS:` line, so this loop stays generic.
            flags="$(sed -n 's|^// JAVA_FLAGS: ||p' "${generator}" | head -1)"
            # shellcheck disable=SC2086
            java ${flags} "${generator}" > "${RUNNER_TEMP}/${name}.inc"
            diff -u "${target}" "${RUNNER_TEMP}/${name}.inc"
          done

          # The MD5 vectors come from md5sum, and the noise vectors from
          # cubiomes at a pinned commit; both are reproduced the same way.
          tools/vectors/generate-md5-vectors.sh "${RUNNER_TEMP}/md5_vectors.inc"
          diff -u tests/unit/md5_vectors.inc "${RUNNER_TEMP}/md5_vectors.inc"

          tools/vectors/generate-noise-vectors.sh "${RUNNER_TEMP}/noise_vectors.inc"
          diff -u tests/unit/noise_vectors.inc "${RUNNER_TEMP}/noise_vectors.inc"

          # The climate vectors come from the same cubiomes commit, one layer
          # up: the seeding chain and the overworld's 2D density functions.
          tools/vectors/generate-climate-vectors.sh "${RUNNER_TEMP}/climate_vectors.inc"
          diff -u tests/conformance/climate_vectors.inc "${RUNNER_TEMP}/climate_vectors.inc"

          # And the legacy blended noise, from the same commit.
          tools/vectors/generate-blended-vectors.sh "${RUNNER_TEMP}/blended_vectors.inc"
          diff -u tests/unit/blended_vectors.inc "${RUNNER_TEMP}/blended_vectors.inc"

          # And the legacy Nether climate (setNetherSeed), from the same commit.
          tools/vectors/generate-nether-vectors.sh "${RUNNER_TEMP}/nether_climate_vectors.inc"
          diff -u tests/unit/nether_climate_vectors.inc "${RUNNER_TEMP}/nether_climate_vectors.inc"

          # And the deepslate oracle, run as a black box at a pinned version:
          # old_blended_noise, and the aquifer's random source.
          tools/vectors/generate-deepslate-vectors.sh "${RUNNER_TEMP}/deepslate_vectors.inc" \
              "${RUNNER_TEMP}/deepslate_aquifer_vectors.inc"
          diff -u tests/unit/deepslate_vectors.inc "${RUNNER_TEMP}/deepslate_vectors.inc"
          diff -u tests/unit/deepslate_aquifer_vectors.inc "${RUNNER_TEMP}/deepslate_aquifer_vectors.inc"

      - name: Generated schema is reproducible
        # The density function, noise settings and surface rule schemas are
        # derived from mcdoc at a pinned commit (SPEC §11), so a hand-edit to
        # the generated tables — or a reader that silently stopped
        # understanding a construct — shows up here rather than as a datapack
        # the engine wrongly rejects.
        run: |
          tools/mcdoc-sync
          git diff --exit-code -- lib/src/density_schema.inc \
              lib/include/stratum/density/node_types.inc \
              lib/src/settings_schema.inc \
              lib/include/stratum/settings/router_entries.inc \
              lib/src/surface_schema.inc \
              lib/include/stratum/surface/rule_types.inc \
              lib/include/stratum/surface/condition_types.inc

      - name: Install clang-tidy
        # Pinned: clang-tidy's check set changes between releases, so an
        # unpinned linter is a gate that moves on its own. Reproduce locally
        # with the same major, e.g. `apt-get download clang-tidy-18` and
        # `dpkg -x` if you would rather not install it system-wide.
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - name: Configure for clang-tidy (compile_commands.json)
        run: cmake --preset dev -B build/tidy -DSTRATUM_BUILD_TESTS=OFF

      - name: clang-tidy
        run: |
          # The same list tools/lint/tidy.sh analyses; keep the two in step.
          mapfile -t sources < <(find lib cli ext/src -name '*.cpp' -not -path '*/_deps/*' | sort; \
            printf '%s\n' tools/analysis/legacy-seed-analyze.cpp \
                           tools/analysis/legacy-goldens-biome-analyze.cpp \
                           tools/analysis/legacy-goldens-surface-analyze.cpp \
                           tools/analysis/aquifer-barrier-analyze.cpp \
                           tools/analysis/aquifer-cells.cpp \
                           tools/analysis/aquifer-deepfloor-analyze.cpp \
                           tools/analysis/aquifer-fluidtype-analyze.cpp \
                           tools/analysis/aquifer-nearsurface-analyze.cpp \
                           tools/analysis/aquifer-presets-scout.cpp \
                           tools/analysis/aquifer-waterlava-analyze.cpp)
          if [ ${#sources[@]} -eq 0 ]; then
            echo "no first-party sources to analyse"; exit 0
          fi
          clang-tidy-18 -p build/tidy --warnings-as-errors='*' "${sources[@]}"

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64 (debug)
            os: ubuntu-24.04
            preset: ci-debug
          - name: linux-x86_64 (release)
            os: ubuntu-24.04
            preset: ci-release
          - name: linux-x86_64 (clang, debug)
            os: ubuntu-24.04
            preset: ci-debug
            # GCC and Clang disagree about when a std::variant instantiates
            # its alternatives' special members, among other things. Without
            # a Linux Clang leg that class of bug only surfaces on macOS.
            cc: clang
            cxx: clang++
          - name: linux-arm64 (debug)
            os: ubuntu-24.04-arm
            preset: ci-debug
          - name: linux-arm64 (release)
            os: ubuntu-24.04-arm
            preset: ci-release
          - name: macos-x86_64 (debug)
            # macos-13 is retired: the job is never assigned a runner, sits
            # queued and is eventually cancelled, which looks like a hang
            # rather than a missing runner.
            os: macos-15-intel
            preset: ci-debug
          - name: macos-arm64 (debug)
            os: macos-14
            preset: ci-debug
          - name: windows-x86_64 (debug)
            os: windows-2022
            preset: ci-debug
          - name: windows-arm64 (debug)
            os: windows-11-arm
            preset: ci-debug
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit and lint suites
        run: ctest --preset ${{ matrix.preset }}

  probes:
    name: probe worlds (${{ matrix.shard }})
    # SPEC §7, §12. Generates the probe worlds and region goldens the
    # conformance cases read: one shard of tools/probe-worlds' table per
    # runner, one server at a time, on x86-64 only, so both conformance legs
    # score the same worlds and a cross-architecture difference is the
    # engine's, never the oracle's. The two goldens shards run
    # tools/fetch-vanilla --generate-regions and cache regions/; the rest
    # run tools/analysis generators and cache probes/.
    # Running the vanilla server requires accepting Mojang's EULA
    # (https://aka.ms/MinecraftEULA). The repository owner accepted it for
    # THIS repository's CI on 2026-10-08, so the job runs here and never in a
    # fork's own CI, where nobody has. No `needs`: it starts at once and keeps
    # the cache warm while a build leg is red. The worlds reach the
    # conformance legs only through the Actions cache, which only this
    # repository's workflow runs can restore; they are never uploaded as an
    # artifact (tools/lint/check-determinism.sh refuses one).
    if: github.repository == 'larryTheCoder/Stratum'
    runs-on: ubuntu-24.04
    # Measured cold on runners (October 2026): capfloor about 24 minutes,
    # water 15, aquifer 14 before the fluidnear units and 33 with them,
    # surface 13.5, legacy 11, end 2 before the presets and y_skip units.
    # markers (ten server starts) has no runner timing yet, nor have the
    # goldens shards (about 15 minutes for goldens-nether and 27 for
    # goldens-overworld locally, on 4 busy cores). Past this, take a
    # generator to have hung; the last log group the job opened names it.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # `tools/probe-worlds shards`. unit.tools.probe_worlds fails if this
        # list and the conformance restores below drift from the table. With
        # lint and the nine build legs, 19 jobs start at once; any past the
        # account's concurrent-job limit wait in the queue.
        shard: [aquifer, water, capfloor, surface, legacy, end, markers, goldens-nether, goldens-overworld]
    steps:
      - uses: actions/checkout@v4

      - name: Name the cache entry
        # Hashes this shard's rows of the table and every script they run,
        # never the engine: an engine change does not change what the server
        # writes, which is what makes caching the worlds pay. Also names the
        # tree the shard writes (`path`): probes/, or regions/ for goldens.
        id: key
        run: tools/probe-worlds key '${{ matrix.shard }}' >> "${GITHUB_OUTPUT}"

      - name: Already generated?
        # Existence only. The conformance legs download the entry, which also
        # keeps it from going unread, and check it before scoring it. Never
        # restore-keys: an older generator's worlds carry the right seeds and
        # ticks_frozen and would pass every check.
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.key.outputs.path }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Pin the JDK
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.PROBE_JAVA }}

      - name: Cache the vanilla server jar
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/server-${{ env.MINECRAFT_VERSION }}.jar
          key: vanilla-server-jar-${{ env.MINECRAFT_VERSION }}

      - name: Fetch vanilla worldgen data
        # The jar, plus the overworld settings and biomes several generators
        # read. Extraction and the data generator only; no world yet (a
        # goldens unit runs fetch-vanilla again, with --generate-regions).
        if: steps.lookup.outputs.cache-hit != 'true'
        run: tools/fetch-vanilla

      - name: Generate
        # Then checks what it wrote (`verify`): every corpus present, from
        # the seed its cases expect, frozen, every spec entry's region there;
        # every golden region whole, all 1024 chunks at full status.
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          # One server at a time on a 16 GB runner, so every density probe
          # gets the heap the water-filled ones need; and an exhausted heap
          # ends the server at once instead of thrashing until
          # density-probe.sh's hour-long settle cap.
          STRATUM_PROBE_XMX: 10G
          JAVA_TOOL_OPTIONS: -XX:+ExitOnOutOfMemoryError
        run: |
          free -m
          tools/probe-worlds generate --shard '${{ matrix.shard }}' --accept-eula

      - name: Save
        # Reached only when every unit of the shard was generated and
        # checked. A key cannot be overwritten, so a partial shard saved here
        # would be read until it was evicted.
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.key.outputs.path }}
          key: ${{ steps.key.outputs.key }}

      - name: Record the cache entry
        # The worlds keep a small run-dependent flow remnant (SPEC §7), so a
        # red probe or golden case right after a regeneration is traced to it
        # from here.
        if: always()
        run: |
          {
            echo "shard \`${{ matrix.shard }}\`: \`${{ steps.key.outputs.key }}\`"
            echo "already generated: ${{ steps.lookup.outputs.cache-hit == 'true' }} (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})"
          } >> "${GITHUB_STEP_SUMMARY}"

  conformance:
    name: conformance (${{ matrix.name }})
    # SPEC §7: scores the engine against vanilla's own output — the worldgen
    # and reports extracted here, and the probe worlds and region goldens the
    # probes job generated, restored from the cache. Every case that skips
    # must be listed, with its reason, in tests/conformance/expected-skips.txt,
    # or the job fails.
    runs-on: ${{ matrix.os }}
    needs: [build, probes]
    # On a green build matrix, as before — but whatever the probe shards did:
    # a shard that failed costs the cases that read its worlds, which then
    # fail this job by name, not the whole suite's report. Outside
    # larryTheCoder/Stratum the probes job is skipped and this runs on
    # extracted data alone, as it did before.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Pin the JDK
        # fetch-vanilla runs the server's own data generator for the biome
        # parameters and the block report, and 1.21.11 needs Java 21+. The
        # runner's default JDK could not run it, which fetch-vanilla only
        # reported as a warning — so both reports were silently absent here
        # until reports/blocks.json became a checked fixture.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure
        run: cmake --preset dev

      - name: Build
        # dev's tree, four jobs wide; the dev build preset stays unpinned
        # for local machines.
        run: cmake --build --preset ci-conformance

      # The jar is content-addressed and its SHA-1 is verified on every run,
      # so caching it is safe and saves pulling 56 MB from Mojang each time.
      # fetch-vanilla re-verifies a cached jar and only re-downloads if the
      # hash does not match. The cache is not publication: only this
      # repository's workflow runs can restore it (SPEC §12), the same rule
      # the probe worlds below rely on.
      - name: Cache the vanilla server jar
        uses: actions/cache@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/server-${{ env.MINECRAFT_VERSION }}.jar
          key: vanilla-server-jar-${{ env.MINECRAFT_VERSION }}

      - name: Fetch vanilla worldgen data
        # Extraction and the jar's own data generator; no world is generated
        # in this job (the probes job does that, goldens included).
        # --with-structures extracts the structure NBT the reader's cases
        # parse, and nothing else: it never turns structures on in a world.
        # Nothing fetched, generated or restored in CI is committed or
        # uploaded as an artifact (SPEC §12).
        run: tools/fetch-vanilla --with-structures

      - name: Check the fixtures really arrived
        # Without this, a fetch that produced nothing would leave every
        # data-driven suite skipping and the job still green — which is the
        # failure mode this whole job exists to avoid.
        run: |
          worldgen=".fixtures/${MINECRAFT_VERSION}/worldgen"
          structures=".fixtures/${MINECRAFT_VERSION}/structure"
          json_count="$(find "${worldgen}" -name '*.json' | wc -l)"
          nbt_count="$(find "${structures}" -name '*.nbt' | wc -l)"
          echo "worldgen JSON: ${json_count}, structure NBT: ${nbt_count}"
          test -d "${worldgen}/density_function"
          test -d "${worldgen}/noise_settings"
          test -s ".fixtures/${MINECRAFT_VERSION}/reports/blocks.json"
          [ "${json_count}" -gt 900 ]
          [ "${nbt_count}" -gt 1000 ]

      - name: Mapping tables are reproducible
        # SPEC §9: the Java -> Bedrock biome and block state tables are
        # derived from GeyserMC/mappings and a GeyserMC/Geyser block palette
        # at pinned commits, cross-checked against this job's own
        # freshly-fetched vanilla biome registry and block report — the
        # dependency tools/mapping-sync has that tools/mcdoc-sync (checked in
        # the lint job, before fixtures exist) does not.
        run: |
          tools/mapping-sync
          git diff --exit-code -- lib/mapping/src/biome_table.inc \
                                  lib/mapping/src/block_state_table.inc

      - name: Name the probe-world cache entries
        # The same keys the probes job saved under, from the same commit.
        id: probe-keys
        if: github.repository == 'larryTheCoder/Stratum'
        run: tools/probe-worlds keys >> "${GITHUB_OUTPUT}"

      # One restore per shard (a restore takes one key, and its path must be
      # the one the shard was saved under); the shards hold disjoint outputs
      # and unpack into probes/, or regions/ for the goldens. A miss fails its
      # step loudly, and the job at the end, but lets the suite run, so the
      # cases the other shards feed still report.
      - name: Restore probe worlds (aquifer)
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/probes
          key: ${{ steps.probe-keys.outputs.aquifer }}
          fail-on-cache-miss: true

      - name: Restore probe worlds (water)
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/probes
          key: ${{ steps.probe-keys.outputs.water }}
          fail-on-cache-miss: true

      - name: Restore probe worlds (capfloor)
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/probes
          key: ${{ steps.probe-keys.outputs.capfloor }}
          fail-on-cache-miss: true

      - name: Restore probe worlds (surface)
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/probes
          key: ${{ steps.probe-keys.outputs.surface }}
          fail-on-cache-miss: true

      - name: Restore probe worlds (legacy)
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/probes
          key: ${{ steps.probe-keys.outputs.legacy }}
          fail-on-cache-miss: true

      - name: Restore probe worlds (end)
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/probes
          key: ${{ steps.probe-keys.outputs.end }}
          fail-on-cache-miss: true

      - name: Restore probe worlds (markers)
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/probes
          key: ${{ steps.probe-keys.outputs.markers }}
          fail-on-cache-miss: true

      - name: Restore region goldens (goldens-nether)
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/regions
          key: ${{ steps.probe-keys.outputs.goldens-nether }}
          fail-on-cache-miss: true

      - name: Restore region goldens (goldens-overworld)
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/regions
          key: ${{ steps.probe-keys.outputs.goldens-overworld }}
          fail-on-cache-miss: true

      - name: Every probe world arrived
        # The CI twin of "Check the fixtures really arrived": several cases
        # score whatever subset of seeds or entries they find, so a missing
        # corpus or golden region would otherwise pass them quietly. The job
        # goes red on this after the suite has run ("Probe worlds were
        # missing").
        id: probe-check
        if: steps.probe-keys.outcome == 'success'
        continue-on-error: true
        run: tools/probe-worlds verify

      - name: Conformance suite
        # Four wide, an hour per case: the probe-backed psl sweep alone takes
        # about 1240 s in Debug, near include(CTest)'s 1500 s default, and
        # the golden "real overworlds" case about 1170 s. The 25 golden cases
        # add about an hour of Debug time in all, spread over the four jobs.
        id: ctest
        run: ctest --preset ci-conformance --output-junit "${RUNNER_TEMP}/conformance-junit.xml"

      - name: No case skipped that was not expected to
        # ctest counts a skip as a pass. Here, where the probe worlds are
        # provided, a skip is either listed with its reason or a failure; so
        # is a listed case that ran, so the list stays exact.
        if: ${{ !cancelled() && steps.probe-keys.outcome == 'success' && (steps.ctest.outcome == 'success' || steps.ctest.outcome == 'failure') }}
        run: tools/check-skips "${RUNNER_TEMP}/conformance-junit.xml" tests/conformance/expected-skips.txt

      - name: Probe worlds were missing
        if: ${{ !cancelled() && steps.probe-check.outcome == 'failure' }}
        run: |
          echo "::error title=probe worlds missing::'Every probe world arrived' names them; the red probes shard says why"
          exit 1

      - name: Report what could not be checked
        # Said out loud rather than left to be inferred from a green tick.
        if: always()
        run: |
          echo "Skipped here by design, each listed in tests/conformance/expected-skips.txt:"
          echo "  no-generator  cases whose probe corpus no committed script produces"
          # The repository, not the key step's outcome: that step is skipped
          # here too whenever a step before it failed.
          if [[ "${GITHUB_REPOSITORY}" != larryTheCoder/Stratum ]]; then
            echo "No probe worlds or region goldens here: outside larryTheCoder/Stratum"
            echo "nobody has accepted Mojang's EULA for this CI (SPEC §12), so every"
            echo "probe- and golden-backed case skipped too, unchecked. Locally:"
            echo "  tools/probe-worlds generate --accept-eula"
          elif [[ "${{ steps.probe-keys.outcome }}" != success ]]; then
            echo "No probe worlds or region goldens were restored: a step before them"
            echo "failed, so no probe- or golden-backed case was checked in this run."
          fi

  ext-pmmp:
    name: ext-pmmp (linux-x86_64)
    # SPEC §11's M5-PMMP entry: ext/'s zend module, built with warnings as
    # errors against a thread-safe PHP matching PocketMine-MP 5's, and tested
    # through PHP's own PHPT runner with pmmp/ext-chunkutils2 loaded beside
    # it — so every sub-chunk the module emits goes through the real
    # PalettedBlockArray::fromData, not a model of it. PocketMine-MP's own PHP
    # releases ship no headers, so tools/php-dev builds this PHP from source.
    runs-on: ubuntu-24.04
    needs: build
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Pin the JDK
        # fetch-vanilla's data generator, for the biome parameter lists the
        # frozen pipeline carries.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: PHP build tools
        run: sudo apt-get update && sudo apt-get install -y bison re2c autoconf

      - name: Cache the PHP build
        # Keyed on the script, which pins the PHP and chunkutils2 versions.
        uses: actions/cache@v4
        with:
          path: ~/.cache/stratum-php
          key: stratum-php-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/php-dev') }}

      - name: Build PHP (ZTS) and chunkutils2
        run: tools/php-dev

      - name: Cache the vanilla server jar
        uses: actions/cache@v4
        with:
          path: .fixtures/${{ env.MINECRAFT_VERSION }}/server-${{ env.MINECRAFT_VERSION }}.jar
          key: vanilla-server-jar-${{ env.MINECRAFT_VERSION }}

      - name: Fetch vanilla worldgen data
        run: tools/fetch-vanilla

      - name: Check the fixtures really arrived
        # The encode-chunk PHPT skips without them; skipping here would leave
        # the job green having checked almost nothing.
        run: |
          test -d ".fixtures/${MINECRAFT_VERSION}/worldgen/noise_settings"
          test -s ".fixtures/${MINECRAFT_VERSION}/biome_parameters/minecraft/overworld.json"

      - name: Plugin syntax
        # The plugin's PHP needs a running PocketMine-MP to execute, which no
        # CI job here has (PROGRESS.md says so plainly). What can be checked
        # is that every file parses — a typo in a plugin only surfaces when a
        # server tries to load it, which is far too late.
        run: |
          php="$("$(tools/php-dev --print-config)" --php-binary)"
          for file in ext/plugin/src/*.php; do
            "${php}" -l "${file}"
          done

      - name: Configure
        run: STRATUM_PHP_CONFIG="$(tools/php-dev --print-config)" cmake --preset ext

      - name: Build
        run: cmake --build --preset ext --target stratum_php

      - name: PHPT suite
        run: ctest --preset ext
